name: Web build and deploy (Cloudflare Pages)
# Starts only by hand (Actions tab -> Run workflow) because the three wasm builds take ~25 min each.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'JSON list: ["vector","photo","pdf"]'
        default: '["vector","photo","pdf"]'

env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  TRUNK_VERSION: "0.21.14"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lighter release profile for CI: the big apps (vector, photo) were killed by the runner (out of memory)
# with the upstream release profile (fat codegen, thin LTO). Final shipping builds can turn LTO back on.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          IN_APPS: ${{ inputs.apps }}
        run: |
          python3 - <<'PY'
          import json, os
          crate = {"vector": "vectorcraft-web", "photo": "photocraft-web", "pdf": "pdfcraft-web"}
          apps = json.loads(os.environ["IN_APPS"] or json.dumps(list(crate)))
          inc = [{"app": a, "crate": crate[a]} for a in apps]
          open(os.environ["GITHUB_OUTPUT"], "a").write("matrix=" + json.dumps({"include": inc}) + "\n")
          PY

  build:
    needs: plan
    name: web / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Hindi/other UI catalogs (best effort)
        shell: bash
        run: |
          # photo/pdf read translations from storytold/craft-i18n at the SHA in apps/<app>/craft-i18n.rev.
          # Without it the UI is English only. Never fails the build: if the clone fails we ship English.
          rev="apps/${{ matrix.app }}/craft-i18n.rev"
          if [ -f "$rev" ]; then
            sha="$(tr -d '[:space:]' < "$rev")"
            if git clone -q https://github.com/storytold/craft-i18n.git "$RUNNER_TEMP/craft-i18n" && git -C "$RUNNER_TEMP/craft-i18n" checkout -q "$sha"; then
              echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"
            else
              echo "::warning::craft-i18n not available; ${{ matrix.app }} will be English only"
            fi
          fi
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/${{ matrix.app }}" }
      - name: Install trunk
        run: |
          curl --proto '=https' -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv trunk /usr/local/bin/
      - name: trunk build
        working-directory: apps/${{ matrix.app }}/apps/${{ matrix.crate }}
        run: trunk build --release
      - name: Check relative URLs
        run: "! grep -Eq '(src|href)=\"/[^/]' apps/${{ matrix.app }}/dist/web/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist/web
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Assemble site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p site
          cp -R platform/web/. site/
          for a in vector photo pdf; do [ -d "artifacts/web-$a" ] && mkdir -p "site/$a" && cp -R "artifacts/web-$a/." "site/$a/"; done; true
          printf 'window.TULIKA_CONFIG = { supabaseUrl: %s, supabaseAnonKey: %s };\n' \
            "$(printf '%s' "$SUPABASE_URL" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')" \
            "$(printf '%s' "$SUPABASE_ANON_KEY" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')" > site/config.js
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=tulika --branch=main
