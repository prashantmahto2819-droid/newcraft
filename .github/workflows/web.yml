name: Web build and deploy (Cloudflare Pages)
# Starts only by hand (Actions tab -> Run workflow) because the wasm builds take ~25 min each.
# Apps not built in a run keep their last build: the deploy job fetches the newest older artifact for them.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'JSON list, any of: ["vector","photo","pdf","film"]'
        default: '["vector","photo","pdf","film"]'
  # Also starts when .github/web-build.request changes on main: that file holds the JSON list of apps to build.
  push:
    branches: [main]
    paths: [".github/web-build.request"]

env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  TRUNK_VERSION: "0.21.14"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lighter release profile for CI: the big apps (vector, photo) were killed by the runner (out of memory)
# with the upstream release profile (fat codegen, thin LTO). Final shipping builds can turn LTO back on.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          IN_APPS: ${{ inputs.apps }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then export IN_APPS="$(head -n 1 .github/web-build.request)"; fi
          python3 - <<'PY'
          import json, os
          crate = {"vector": "vectorcraft-web", "photo": "photocraft-web", "pdf": "pdfcraft-web", "film": "filmcraft-web"}
          apps = json.loads(os.environ["IN_APPS"] or json.dumps(list(crate)))
          inc = [{"app": a, "crate": crate[a]} for a in apps]
          open(os.environ["GITHUB_OUTPUT"], "a").write("matrix=" + json.dumps({"include": inc}) + "\n")
          PY

  build:
    needs: plan
    name: web / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Hindi/other UI catalogs (best effort)
        shell: bash
        run: |
          # photo/pdf read translations from storytold/craft-i18n at the SHA in apps/<app>/craft-i18n.rev.
          # Without it the UI is English only. Never fails the build: if the clone fails we ship English.
          rev="apps/${{ matrix.app }}/craft-i18n.rev"
          if [ -f "$rev" ]; then
            sha="$(tr -d '[:space:]' < "$rev")"
            if git clone -q https://github.com/storytold/craft-i18n.git "$RUNNER_TEMP/craft-i18n" && git -C "$RUNNER_TEMP/craft-i18n" checkout -q "$sha"; then
              echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"
            else
              echo "::warning::craft-i18n not available; ${{ matrix.app }} will be English only"
            fi
          fi
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/${{ matrix.app }}" }
      - name: Install trunk
        if: matrix.app != 'film'
        run: |
          curl --proto '=https' -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv trunk /usr/local/bin/
      - name: trunk build
        if: matrix.app != 'film'
        working-directory: apps/${{ matrix.app }}/apps/${{ matrix.crate }}
        run: trunk build --release
      # Film has no Trunk.toml: upstream builds it with `cargo xtask web` (wasm-bindgen CLI 0.2.129, see apps/film/docs/web.md).
      - name: Film web build (cargo xtask web)
        if: matrix.app == 'film'
        working-directory: apps/film
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo xtask web
          mkdir -p dist && rm -rf dist/web && cp -r target/web/dist dist/web
      - name: Check relative URLs
        run: "! grep -Eq '(src|href)=\"/[^/]' apps/${{ matrix.app }}/dist/web/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist/web
          retention-days: 90

  deploy:
    needs: build
    # runs even when one app failed to build, so the others still go live
    if: always() && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Keep the last build of apps not built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in vector photo pdf film; do
            [ -d "artifacts/web-$a" ] && continue
            url="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=web-$a&per_page=10" --jq '[.artifacts[] | select(.expired==false)][0].archive_download_url // empty')"
            if [ -z "$url" ]; then echo "::warning::no earlier build of $a"; continue; fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$a.zip" "$url" && mkdir -p "artifacts/web-$a" && unzip -q "$a.zip" -d "artifacts/web-$a" && echo "$a: reused"
          done
      - name: Assemble site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: tools/assemble_site.sh artifacts
      - name: Upload files over 25 MiB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: tools/upload_big.sh
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=tulika --branch=main --commit-dirty=true
