name: Desktop builds
# Cost note: on a private repo Windows minutes count 2x and macOS minutes 10x against the Actions quota, and each
# app takes 45-90 min. So this only runs when you start it by hand (default: Linux only) or push a v* tag (all three).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      os:
        description: 'JSON list of runners, e.g. ["ubuntu-latest","windows-latest"]'
        default: '["ubuntu-latest"]'
      apps:
        description: 'JSON list of apps, e.g. ["photo","vector"]'
        default: '["vector","photo","pdf","film"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lighter release profile for CI: the big apps (vector, photo) were killed by the runner (out of memory)
# with the upstream release profile (fat codegen, thin LTO). Final shipping builds can turn LTO back on.
env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  CARGO_BUILD_JOBS: "2"
  CARGO_NET_RETRY: "5"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          IN_OS: ${{ inputs.os }}
          IN_APPS: ${{ inputs.apps }}
        run: |
          python3 - <<'PY'
          import json, os
          pk = {"vector": "vectorcraft", "photo": "photocraft", "pdf": "pdfcraft", "film": "filmcraft"}
          push = os.environ["EVENT"] == "push"
          oses = ["windows-latest", "ubuntu-latest", "macos-latest"] if push else json.loads(os.environ["IN_OS"] or '["ubuntu-latest"]')
          apps = list(pk) if push else json.loads(os.environ["IN_APPS"] or json.dumps(list(pk)))
          inc = [{"os": o, "app": a, "pkg": pk[a], "label": "tulika-" + a} for o in oses for a in apps]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": inc}) + "\n")
          print(inc)
          PY

  build:
    needs: plan
    name: ${{ matrix.app }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libgtk-3-dev libasound2-dev libudev-dev \
            libfontconfig1-dev libssl-dev
      - name: Build (release)
        working-directory: apps/${{ matrix.app }}
        run: cargo build --release -p ${{ matrix.pkg }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          bin="apps/${{ matrix.app }}/target/release/${{ matrix.pkg }}"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "out/${{ matrix.label }}-${{ runner.os }}$([ -f "$bin" ] && [ "${bin##*.}" = exe ] && echo .exe)"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ runner.os }}
          path: out/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }
