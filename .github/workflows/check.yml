name: Desktop compile check
# Quick answer to "does the desktop code compile on Windows?" without the long release build.
# Starts when .github/desktop-check.request changes on main (line 1 = JSON list of apps) or by hand.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'JSON list, any of: ["vector","photo","pdf","film"]'
        default: '["film"]'
  push:
    branches: [main]
    paths: [".github/desktop-check.request"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_NET_RETRY: "5"
  CARGO_INCREMENTAL: "0"

jobs:
  license:
    name: tulika-license (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libdbus-1-dev
      - name: Check and test
        working-directory: platform/desktop/tulika-license
        run: cargo test

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        shell: bash
        env:
          IN_APPS: ${{ inputs.apps }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then IN_APPS="$(head -n 1 .github/desktop-check.request)"; fi
          export IN_APPS
          python3 - <<'PY'
          import json, os
          pk = {"vector": "vectorcraft", "photo": "photocraft", "pdf": "pdfcraft", "film": "filmcraft"}
          apps = [a for a in json.loads(os.environ.get("IN_APPS") or '["film"]') if a in pk]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": [{"app": a, "pkg": pk[a]} for a in apps]}) + "\n")
          PY

  app:
    needs: plan
    name: ${{ matrix.app }} / Windows check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}
          key: check
      - name: cargo check
        working-directory: apps/${{ matrix.app }}
        run: cargo check -p ${{ matrix.pkg }}
