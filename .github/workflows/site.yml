name: Site only deploy (dashboard + tools; optionally reuse a finished web build)
# Deploys platform/web to Cloudflare Pages in about a minute, without compiling anything.
# Optional input artifacts_run_id: the id of a finished "Web build and deploy" run (the number in its
# URL, artifacts are kept 14 days). Its vector/photo/pdf builds are then added to the site, and files
# over 25 MiB go to R2. Without it the three apps are placeholder pages.
# Runs by hand or on a push that changes platform/web. Needs the same secrets and DEPLOY_PAGES variable.
on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: 'Optional: run id of a finished web build to reuse (e.g. 44885769819)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ["platform/web/**", "functions/**", "wrangler.toml", "tools/assemble_site.sh", "tools/upload_big.sh", ".github/workflows/site.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.artifacts_run_id != '' }}
        with:
          path: artifacts
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ github.token }}
      - name: Fetch the newest app builds (when no run id was given)
        if: ${{ inputs.artifacts_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keeps the already deployed apps on every dashboard-only deploy: takes the newest unexpired
          # web-vector / web-photo / web-pdf artifact of any run. None found -> that app is a placeholder page.
          mkdir -p artifacts
          for a in vector photo pdf; do
            url="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=web-$a&per_page=10" --jq '[.artifacts[] | select(.expired==false)][0].archive_download_url // empty')"
            if [ -z "$url" ]; then echo "::warning::no unexpired artifact for $a"; continue; fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$a.zip" "$url" && mkdir -p "artifacts/web-$a" && unzip -q "$a.zip" -d "artifacts/web-$a" && echo "$a: $(du -sh artifacts/web-$a | cut -f1)"
          done
      - name: Assemble site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: tools/assemble_site.sh artifacts
      - name: Upload files over 25 MiB to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: tools/upload_big.sh
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=tulika --branch=main --commit-dirty=true
