[package]
name = "tulika-license"
description = "Sign-in and device licence check for the Tulika desktop apps"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# HTTPS to the Tulika cloud (Supabase REST). rustls + bundled roots: no system OpenSSL needed.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
# Native message boxes for the sign-in steps (the apps already use rfd 0.17 for file dialogs).
rfd = "0.17"
